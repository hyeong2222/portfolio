# 글몬 안드로이드 자동 빌드
# - 이 파일이 있는 레포에 코드를 올리면(push) GitHub가 알아서 .aab(플레이 스토어용)와 .apk(테스트 설치용)를 만들어 준다.
# - 결과물: Actions 탭 → 해당 실행 → 맨 아래 Artifacts 에서 다운로드
name: Build Geulmon Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:     # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 실행 권한
        run: chmod +x gradlew

      - name: 빌드 (AAB + APK)
        env:
          # GitHub Secrets에 등록해 두면 레포에 포함된 keystore 대신 사용됩니다 (선택)
          GEULMON_KEYSTORE_PASSWORD: ${{ secrets.GEULMON_KEYSTORE_PASSWORD }}
          GEULMON_KEY_PASSWORD: ${{ secrets.GEULMON_KEY_PASSWORD }}
        run: |
          # Secrets가 비어 있으면 기본값(레포 keystore)이 쓰이도록 빈 값은 제거
          [ -z "$GEULMON_KEYSTORE_PASSWORD" ] && unset GEULMON_KEYSTORE_PASSWORD
          [ -z "$GEULMON_KEY_PASSWORD" ] && unset GEULMON_KEY_PASSWORD
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: 결과물 정리
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/*.aab out/geulmon-release.aab
          cp app/build/outputs/apk/release/*.apk out/geulmon-release.apk
          ls -la out

      - name: 플레이 스토어용 AAB 업로드
        uses: actions/upload-artifact@v4
        with:
          name: geulmon-aab
          path: out/geulmon-release.aab

      - name: 테스트 설치용 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: geulmon-apk
          path: out/geulmon-release.apk
