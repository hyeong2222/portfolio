plugins {
    id 'com.android.application'
}

// 서명키: keystore/upload.jks (레포에 포함). GitHub Secrets가 있으면 그것을 우선 사용.
def ksFile = rootProject.file(System.getenv('GEULMON_KEYSTORE') ?: 'keystore/upload.jks')
def ksPass = System.getenv('GEULMON_KEYSTORE_PASSWORD') ?: 'geulmon2026'
def keyAlias_ = System.getenv('GEULMON_KEY_ALIAS') ?: 'upload'
def keyPass = System.getenv('GEULMON_KEY_PASSWORD') ?: 'geulmon2026'

android {
    namespace 'kr.co.kangyu.geulmon'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.co.kangyu.geulmon'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias keyAlias_
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    bundle {
        language { enableSplit = false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
