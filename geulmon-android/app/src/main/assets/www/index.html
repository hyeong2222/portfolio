<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>글몬</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1519">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --ink: #0f1519; --surface: #1a232b; --surface-2: #232e38; --line: #2d3a46;
    --paper: #f2ecdc; --muted: #97a5b2; --mint: #7fe0a6; --mint-deep: #2f8f5c;
    --amber: #ffbe55; --coral: #ff6f61; --violet: #b18cff; --sky: #6fc7ff;
    --display: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.5; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  input { font: inherit; }
  [hidden] { display: none !important; }

  #app { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; background: var(--ink); overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  /* ---- HUD ---- */
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud-avatar { position: absolute; left: 12px; top: calc(12px + env(safe-area-inset-top)); width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--surface); padding: 0; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .hud-avatar .ring { position: absolute; inset: -3px; width: calc(100% + 6px); height: calc(100% + 6px); transform: rotate(-90deg); }
  .hud-avatar .ring circle { fill: none; stroke-width: 7; stroke: var(--line); }
  .hud-avatar .ring #xp-ring { stroke: var(--mint); stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; transition: stroke-dashoffset .5s; }
  .hud-avatar canvas { position: absolute; inset: 4px; width: 56px; height: 56px; border-radius: 50%; }
  .hud-avatar .lv { position: absolute; right: -4px; bottom: -4px; background: var(--mint); color: #0c1b13; font-family: var(--display); font-size: 14px; min-width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .hud-right { position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .hud-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(15,21,25,.75); color: var(--paper); display: flex; align-items: center; justify-content: center; padding: 0; }
  .hud-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .hud-btn.on { color: var(--mint); border-color: var(--mint-deep); }
  .hud-effects { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .hud-effects .eff { background: rgba(15,21,25,.8); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 12px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .hud-status { position: absolute; left: 50%; top: calc(20px + env(safe-area-inset-top)); transform: translateX(-50%); background: rgba(15,21,25,.75); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
  .vpad { position: absolute; right: 14px; bottom: 110px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .vpad div { display: flex; gap: 2px; }
  .vpad button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(15,21,25,.75); color: var(--paper); font-size: 14px; }

  /* ---- 하단 ---- */
  .bottom { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .main-btn { width: 72px; height: 72px; border-radius: 50%; border: 0; background: transparent; padding: 0; filter: drop-shadow(0 6px 12px rgba(0,0,0,.45)); transition: transform .15s; }
  .main-btn:active { transform: scale(.94); }
  .main-btn canvas { width: 72px; height: 72px; }
  .buddy-btn { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); background: rgba(15,21,25,.8); padding: 0; overflow: hidden; }
  .buddy-btn canvas { width: 50px; height: 50px; }
  .nearby-btn { background: rgba(15,21,25,.85); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 6px 8px; display: flex; align-items: center; }
  #nearby-tray { display: flex; align-items: center; gap: 2px; }
  #nearby-tray canvas { width: 36px; height: 36px; border-radius: 8px; }
  #nearby-tray .n { font-family: var(--display); font-size: 16px; padding: 0 6px; color: var(--mint); }

  /* ---- 메인 메뉴 ---- */
  .menu { position: absolute; inset: 0; background: rgba(10,14,18,.86); backdrop-filter: blur(4px); display: none; z-index: 20; }
  .menu.show { display: block; }
  .menu-items { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); width: 320px; height: 230px; transform: translateX(-50%); }
  .menu-items button { position: absolute; width: 84px; background: none; border: 0; color: var(--paper); font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .menu-items button i { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .menu-items button i canvas { width: 44px; height: 44px; }
  .menu-items button:nth-child(1) { left: 0; top: 124px; }    .menu-items button:nth-child(2) { left: 26px; top: 26px; }
  .menu-items button:nth-child(3) { left: 118px; top: -14px; } .menu-items button:nth-child(4) { left: 210px; top: 26px; }
  .menu-items button:nth-child(5) { left: 236px; top: 124px; } .menu-items button:nth-child(6) { left: 118px; top: 80px; }
  .menu-items button:nth-child(7) { left: 118px; top: 170px; }
  .menu-close { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); background: var(--surface); color: var(--paper); font-size: 26px; }

  /* ---- 오버레이 ---- */
  .overlay { position: absolute; inset: 0; background: var(--ink); display: none; flex-direction: column; z-index: 15; }
  .overlay.show { display: flex; }
  .ov-head { padding: calc(14px + env(safe-area-inset-top)) 16px 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ov-head h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 400; }
  .ov-head h2 span { font-family: var(--body); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; }
  .ov-body { flex: 1; overflow-y: auto; padding: 0 16px calc(110px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .ov-close { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); background: var(--surface); color: var(--paper); font-size: 24px; z-index: 16; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .sort { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 3px; }
  .sort button { border: 0; background: none; color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  .sort button.on { background: var(--surface-2); color: var(--paper); }
  .coin-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 14px !important; color: var(--amber) !important; font-family: var(--display); }
  .coin-chip canvas { width: 22px; height: 22px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 14px; }
  .section-title { padding: 18px 0 6px; font-size: 12px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }

  .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .5px; vertical-align: middle; }
  .tag.r0 { background: #2b3a33; color: var(--mint); } .tag.r1 { background: #24343f; color: var(--sky); } .tag.r2 { background: #322a48; color: var(--violet); } .tag.r3 { background: #46341a; color: var(--amber); } .tag.k { background: #3d2a2a; color: #ffb3a7; }
  .type { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--tc); color: #10161a; vertical-align: middle; }
  .cp { font-family: var(--display); color: var(--amber); font-variant-numeric: tabular-nums; }
  .btn { border: 0; border-radius: 12px; padding: 10px 14px; font-family: var(--display); font-size: 17px; letter-spacing: .3px; background: var(--mint); color: #0c1b13; }
  .btn:disabled { background: var(--surface-2); color: var(--muted); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--paper); font-family: var(--body); font-size: 14px; }
  .btn.warm { background: var(--amber); color: #2a1a00; }
  .btn.danger { background: var(--coral); color: #fff; }
  .btn.sm { padding: 6px 12px; font-size: 15px; border-radius: 10px; }

  /* ---- 글몬 목록 ---- */
  .mon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-top: 4px; }
  .mon-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .mon-card canvas { width: 76px; height: 76px; }
  .mon-card .cp { font-size: 15px; } .mon-card .nm { font-size: 13px; }
  .mon-card .fav { position: absolute; right: 6px; top: 6px; color: var(--amber); font-size: 13px; }
  .mon-card .gym { position: absolute; left: 6px; top: 6px; font-size: 11px; color: var(--sky); }
  .mon-card .hpbar { width: 80%; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .mon-card .hpbar i { display: block; height: 100%; background: var(--mint); }
  .mon-card.ko { opacity: .6; }

  /* ---- 상세 ---- */
  .detail-hero { position: relative; padding: calc(10px + env(safe-area-inset-top)) 0 0; text-align: center; }
  .detail-hero .arc { width: 240px; height: 130px; margin: 0 auto; display: block; }
  .detail-hero .art { margin-top: -110px; }
  .detail-hero .art canvas { width: 200px; height: 200px; }
  .detail-hero .cpbig { position: absolute; left: 50%; top: calc(6px + env(safe-area-inset-top)); transform: translateX(-50%); font-family: var(--display); font-size: 24px; color: var(--paper); }
  .detail-hero .cpbig small { font-size: 14px; color: var(--muted); font-family: var(--body); margin-right: 4px; }
  .detail-name { text-align: center; }
  .detail-name h2 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 400; display: inline-flex; align-items: center; gap: 8px; }
  .detail-name .edit { background: none; border: 0; color: var(--muted); font-size: 16px; }
  .detail-name .types { margin-top: 4px; display: flex; gap: 6px; justify-content: center; }
  .hp-row { margin: 10px auto 0; max-width: 300px; }
  .hp-row .bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .hp-row .bar i { display: block; height: 100%; background: var(--mint); }
  .hp-row .txt { text-align: center; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat-grid .st { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
  .stat-grid .st b { display: block; font-family: var(--display); font-size: 18px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .stat-grid .st span { font-size: 11px; color: var(--muted); }
  .iv-row { display: flex; gap: 6px; margin-top: 8px; }
  .iv-row .iv { flex: 1; background: var(--surface); border-radius: 10px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
  .iv-row .iv i { display: block; height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 4px; overflow: hidden; }
  .iv-row .iv i b { display: block; height: 100%; background: var(--sky); }
  .res-row { display: flex; gap: 8px; margin-top: 14px; }
  .res-row .res { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .res-row .res canvas { width: 30px; height: 30px; }
  .res-row .res b { font-family: var(--display); font-size: 18px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .res-row .res span { display: block; font-size: 11px; color: var(--muted); }
  .act-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .act-row .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px; font-size: 16px; }
  .act-row .btn small { font-family: var(--body); font-size: 12px; opacity: .8; }
  .moves { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .move { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-left: 4px solid var(--tc); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .move span { color: var(--muted); font-size: 12px; }
  .link-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .link-row .btn { flex: 1; min-width: 100px; }
  .evo-chain { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
  .evo-chain .ev { text-align: center; font-size: 12px; color: var(--muted); }
  .evo-chain .ev canvas { width: 56px; height: 56px; display: block; margin: 0 auto; }
  .evo-chain .arrow { color: var(--muted); font-size: 18px; }
  .quote { margin-top: 12px; padding: 10px 12px; background: var(--surface-2); border-left: 3px solid var(--amber); border-radius: 8px; font-size: 14px; line-height: 1.6; }
  .quote b { color: var(--amber); font-weight: 700; }
  .desc { color: var(--muted); font-size: 14px; margin-top: 12px; line-height: 1.6; }

  /* ---- 도감 ---- */
  .dex-row { display: grid; grid-template-columns: 44px 56px 1fr auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; margin-top: 8px; }
  .dex-row .no { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .dex-row canvas { width: 56px; height: 56px; }
  .dex-row .nm { font-family: var(--display); font-size: 17px; }
  .dex-row .sub { font-size: 12px; color: var(--muted); }
  .dex-row .cnt { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .dex-row.unseen { opacity: .55; } .dex-row.seen canvas { filter: brightness(0) invert(.3); }

  /* ---- 가방 / 상점 ---- */
  .item-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-top: 8px; }
  .item-row canvas { width: 52px; height: 52px; }
  .item-row .nm { font-weight: 500; } .item-row .nm b { font-family: var(--display); font-weight: 400; color: var(--amber); margin-left: 4px; }
  .item-row .sub { font-size: 12px; color: var(--muted); }
  .item-row .price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); color: inherit; }
  .item-row .price canvas { width: 18px; height: 18px; }
  .bag-meter { margin-top: 6px; font-size: 12px; color: var(--muted); }

  /* ---- 알 / 파트너 ---- */
  .inc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .inc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .inc canvas { width: 64px; height: 64px; }
  .inc .km { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .inc .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .inc .bar i { display: block; height: 100%; background: var(--amber); }
  .buddy-card { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 8px; }
  .buddy-card canvas { width: 96px; height: 96px; }
  .buddy-card .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .buddy-card .bar i { display: block; height: 100%; background: var(--mint); }

  /* ---- 트레이너 ---- */
  .me-head { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; padding-top: 6px; }
  .me-head canvas { width: 84px; height: 84px; border-radius: 50%; background: var(--surface); }
  .me-head h3 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 400; }
  .me-head .team { font-size: 13px; color: var(--muted); }
  .me-head .lv { font-family: var(--display); font-size: 40px; color: var(--mint); line-height: 1; }
  .xpbar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint-deep), var(--mint)); }
  .xpnote { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stats3 .st { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stats3 .st b { display: block; font-family: var(--display); font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .stats3 .st span { font-size: 11px; color: var(--muted); }
  .medal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .medal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .medal .ic { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 16px; background: var(--surface-2); color: var(--muted); }
  .medal .ic.t1 { background: #8a5a2b; color: #fff; } .medal .ic.t2 { background: #b8bcc4; color: #222; } .medal .ic.t3 { background: var(--amber); color: #2a1a00; }
  .medal .nm { font-size: 12px; } .medal .pr { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list .item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
  .list .item span { color: var(--muted); font-size: 12px; } .list .item.on { border-color: var(--mint-deep); }
  .journal .j { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .journal .j canvas { width: 32px; height: 32px; } .journal .j span { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .team-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .team-pick button { border: 2px solid var(--tc); background: var(--surface); color: var(--paper); border-radius: 14px; padding: 14px 6px; font-family: var(--display); font-size: 22px; }
  .team-pick button small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ---- 근처 ---- */
  .near-item { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-top: 8px; }
  .near-item canvas { width: 56px; height: 56px; } .near-item .nm { font-family: var(--display); font-size: 18px; } .near-item .ds { font-size: 12px; color: var(--muted); }

  /* ---- 시트 ---- */
  .modal { position: fixed; inset: 0; background: rgba(6,10,13,.78); display: none; align-items: flex-end; justify-content: center; z-index: 30; }
  .modal.show { display: flex; }
  .sheet { width: 100%; max-width: 520px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); max-height: 88vh; overflow-y: auto; }
  .sheet h3 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 400; }
  .sheet p { margin: 8px 0 0; } .sheet .sub { color: var(--muted); font-size: 13px; }

const CPM_TABLE = [0, 0.094, 0.16639787, 0.21573247, 0.25572005, 0.29024988, 0.3210876, 0.34921268, 0.37523559, 0.39956728, 0.42250001,
  0.44310755, 0.46279839, 0.48168495, 0.49985844, 0.51739395, 0.53435433, 0.55079269, 0.56675452, 0.58227891, 0.59740001,
  0.61215729, 0.62656713, 0.64065295, 0.65443563, 0.667934, 0.68116492, 0.69414365, 0.70688421, 0.71939909, 0.7317,
  0.73776948, 0.74378943, 0.74976104, 0.75568551, 0.76156384, 0.76739717, 0.7731865, 0.77893275, 0.78463697, 0.79030001];
function cpm(level) { // level은 0.5 단위
  const lo = Math.floor(level), hi = Math.min(40, lo + 1);
  const a = CPM_TABLE[lo], b = CPM_TABLE[hi];
  return level === lo ? a : Math.sqrt((a * a + b * b) / 2);
}
function calcCP(m, iv, level) {
  const [ba, bd, bs] = m.base; const c = cpm(level);
  return Math.max(10, Math.floor((ba + iv[0]) * Math.sqrt(bd + iv[1]) * Math.sqrt(bs + iv[2]) * c * c / 10));
}
function calcHP(m, iv, level) { return Math.max(10, Math.floor((m.base[2] + iv[2]) * cpm(level))); }
function statAtk(m, iv, level) { return (m.base[0] + iv[0]) * cpm(level); }
function statDef(m, iv, level) { return (m.base[1] + iv[1]) * cpm(level); }
function ivPercent(iv) { return Math.round((iv[0] + iv[1] + iv[2]) / 45 * 100); }
function ivGrade(iv) { const p = ivPercent(iv); return p >= 90 ? { t: '최상', c: 'var(--amber)' } : p >= 70 ? { t: '우수', c: 'var(--mint)' } : p >= 45 ? { t: '보통', c: 'var(--sky)' } : { t: '평범', c: 'var(--muted)' }; }
function randIV() { return [Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), Math.floor(Math.random() * 16)]; }

function powerUpCost(level) {

  const candy = level < 11 ? 1 : level < 21 ? 2 : level < 31 ? 3 : level < 37 ? 4 : 6;
  return { dust, candy };
}
function maxPowerLevel(playerLevel) { return Math.min(MAX_LEVEL, playerLevel + 2); }

function instCP(i) { return calcCP(MON[i.id], i.iv, i.level); }
function instMaxHP(i) { return calcHP(MON[i.id], i.iv, i.level); }
function instName(i) { return i.nick || MON[i.id].name; }

// 야생 레벨
function wildLevel(playerLevel) { return 1 + Math.floor(Math.random() * Math.min(30, playerLevel + 2)); }

// 포획 확률 (PGO 방식)
function catchProb(m, level, opts) {
  const bcr = BASE_CATCH[m.rarity];
  const base = bcr / (2 * cpm(level));
  const mult = (opts.ball || 1) * (opts.berry || 1) * (opts.curve ? 1.7 : 1) * (opts.throwMult || 1) * (opts.medal || 1);
  return Math.min(0.99, 1 - Math.pow(1 - Math.min(1, base), mult));
}
function throwGrade(r) { // r: 링 반지름 비율 (0~1), 링 안에 착지했을 때
  if (r <= 0.3) return { name: 'Excellent', mult: 2 - r, xp: 100 };
  if (r <= 0.7) return { name: 'Great', mult: 2 - r, xp: 50 };
  return { name: 'Nice', mult: 2 - r, xp: 20 };
}

// 데미지
function damage(power, atk, def, mult, stab) { return Math.floor(0.5 * power * (atk / def) * mult * (stab ? 1.2 : 1)) + 1; }

// 포획 보상
function catchRewards(m, isNew) {
  const stage = m.stage;
  return { dust: stage === 1 ? 100 : stage === 2 ? 300 : 500, candy: stage === 1 ? 3 : stage === 2 ? 5 : 10, xp: 100 + (isNew ? 500 : 0) };
}

// ===== 2D 스프라이트: 헬퍼 + 몸통 (v1 계승) =====
const INK = '#22190f';
const LINE_W = 4.5;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + amt)); g = Math.max(0, Math.min(255, g + amt)); b = Math.max(0, Math.min(255, b + amt));
  return `rgb(${r},${g},${b})`;
}

function strokeFill(ctx, fill) {
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = LINE_W; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
}

function ellipsePath(ctx, x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

function eyes(ctx, m, x, y, gap, size, blink) {
  const style = m.eye;
  for (const s of [-1, 1]) {
    const ex = x + s * gap;
    if (blink) {
      ctx.beginPath(); ctx.moveTo(ex - size, y); ctx.lineTo(ex + size, y);
      ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();
      continue;
    }
    if (style === 'none') {
      // 화룡점정: 흰자만 있고 눈동자 없음 (포획 후 pupil 표시)
      ellipsePath(ctx, ex, y, size * 1.5, size * 1.7); strokeFill(ctx, '#fff');
      if (m._caught) { ctx.beginPath(); ctx.arc(ex + s * 1, y + 1, size * 0.8, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill(); }
      continue;
    }
    if (style === 'cat') {
      ellipsePath(ctx, ex, y, size * 1.2, size * 1.7); strokeFill(ctx, '#ffd35a');
      ellipsePath(ctx, ex, y, size * 0.35, size * 1.4); ctx.fillStyle = INK; ctx.fill();
      continue;
    }
    if (style === 'round' || style === 'shine') {
      ellipsePath(ctx, ex, y, size * 1.4, size * 1.6); strokeFill(ctx, '#fff');
      ctx.beginPath(); ctx.arc(ex + s * 1.5, y + 1.5, size * 0.9, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
      if (style === 'shine') { ctx.beginPath(); ctx.arc(ex + s * 0.2, y - 1.5, size * 0.35, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); }
      continue;
    }
    // dot
    ctx.beginPath(); ctx.arc(ex, y, size, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath(); ctx.arc(ex - size * 0.35, y - size * 0.35, size * 0.32, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  }
}

function mouth(ctx, x, y, w, kind) {
  ctx.beginPath(); ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  if (kind === 'w') { ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x - w / 2, y + w * 0.7, x, y); ctx.quadraticCurveTo(x + w / 2, y + w * 0.7, x + w, y); }
  else if (kind === 'o') { ctx.arc(x, y + 2, w * 0.5, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill(); return; }
  else { ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x, y + w * 0.9, x + w, y); }
  ctx.stroke();
}

function blush(ctx, x, y, gap) {
  ctx.fillStyle = 'rgba(255,120,120,.45)';
  for (const s of [-1, 1]) { ellipsePath(ctx, x + s * gap, y, 8, 5); ctx.fill(); }
}

function highlight(ctx, x, y, rx, ry) {
  ellipsePath(ctx, x, y, rx, ry); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
}

// 각 몸통 타입별 드로잉. 좌표계: 200x200, 바닥 y≈175
const BODIES = {
  blob(ctx, m, t) {
    const sq = 1 + Math.sin(t * 3) * 0.04;
    ctx.save(); ctx.translate(100, 130); ctx.scale(1 / sq, sq); ctx.translate(-100, -130);
    ctx.beginPath();
    ctx.moveTo(40, 150); ctx.bezierCurveTo(30, 90, 60, 60, 100, 60); ctx.bezierCurveTo(140, 60, 170, 90, 160, 150);
    ctx.bezierCurveTo(150, 175, 50, 175, 40, 150); ctx.closePath(); strokeFill(ctx, m.c1);
    highlight(ctx, 72, 88, 14, 9);
    eyes(ctx, m, 100, 108, 22, 5.5, m._blink); mouth(ctx, 100, 128, 9, 'w'); blush(ctx, 100, 124, 36);
    ctx.restore();
  },
  leaf(ctx, m, t) {
    // 잎둥이: 둥근 몸 + 머리 새싹
    ctx.beginPath(); ctx.ellipse(100, 125, 52, 48, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    const sway = Math.sin(t * 2) * 6;
    ctx.beginPath(); ctx.moveTo(100, 78); ctx.quadraticCurveTo(100 + sway, 60, 102 + sway, 46);
    ctx.lineWidth = 4; ctx.strokeStyle = m.c2; ctx.stroke();
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(102 + sway, 50);
      ctx.quadraticCurveTo(102 + sway + s * 26, 34, 102 + sway + s * 30, 50);
      ctx.quadraticCurveTo(102 + sway + s * 14, 58, 102 + sway, 50); strokeFill(ctx, m.c2);
    }

  },
  bug(ctx, m, t) {
    // 반디: 어두운 몸, 빛나는 꼬리, 날개
    const glow = 0.6 + Math.sin(t * 5) * 0.4;
    ctx.save(); ctx.globalAlpha = glow * 0.55; ctx.beginPath(); ctx.arc(146, 142, 30, 0, Math.PI * 2); ctx.fillStyle = m.c2; ctx.fill(); ctx.restore();
    for (const s of [-1, 1]) {
      ctx.save(); ctx.translate(100, 92); ctx.rotate(s * (0.5 + Math.sin(t * 20) * 0.25));
      ctx.beginPath(); ctx.ellipse(s * 34, -10, 30, 14, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,230,255,.55)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
    }

    ctx.beginPath(); ctx.ellipse(96, 122, 40, 34, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.arc(82, 96, 28, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(82 + s * 12, 72); ctx.quadraticCurveTo(82 + s * 22, 52, 82 + s * 30, 48); ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke(); }
    eyes(ctx, m, 82, 96, 11, 4.5, m._blink); mouth(ctx, 82, 110, 5, 'w');
  },
  drop(ctx, m, t) {
    const bob = Math.sin(t * 3) * 3;
    ctx.beginPath(); ctx.moveTo(100, 50 + bob);
    ctx.bezierCurveTo(130, 90 + bob, 152, 110 + bob, 152, 138); ctx.arc(100, 138, 52, 0, Math.PI, false);
    ctx.bezierCurveTo(48, 110 + bob, 70, 90 + bob, 100, 50 + bob); ctx.closePath(); strokeFill(ctx, m.c1);
    highlight(ctx, 76, 118, 10, 16);
    eyes(ctx, m, 100, 130, 20, 5, m._blink); mouth(ctx, 100, 150, 8, 'o'); blush(ctx, 100, 146, 36);
  },
  rock(ctx, m, t) {
    ctx.beginPath(); ctx.moveTo(40, 160); ctx.lineTo(50, 100); ctx.lineTo(80, 72); ctx.lineTo(128, 68); ctx.lineTo(160, 98); ctx.lineTo(164, 160); ctx.closePath(); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.moveTo(60, 100); ctx.lineTo(90, 88); ctx.lineWidth = 3; ctx.strokeStyle = m.c2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(128, 120); ctx.lineTo(150, 132); ctx.stroke();
    // 이끼 모자
    ctx.beginPath(); ctx.moveTo(78, 74); ctx.quadraticCurveTo(100, 40, 134, 70); ctx.quadraticCurveTo(110, 66, 78, 74); strokeFill(ctx, '#6fa04a');
    eyes(ctx, m, 104, 112, 22, 5, m._blink); mouth(ctx, 104, 134, 10, 'flat');
  },
  cloud(ctx, m, t) {
    const bob = Math.sin(t * 2) * 4;
    ctx.save(); ctx.translate(0, bob);
    // 구름
    const puffs = [[70, 150, 26], [104, 142, 32], [140, 152, 24]];
    for (const [x, y, r] of puffs) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); strokeFill(ctx, '#dfe7f2'); }

    ctx.fillStyle = '#dfe7f2';
    for (const [x, y, r] of puffs) { ctx.beginPath(); ctx.arc(x, y, r - LINE_W / 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillRect(46 + LINE_W / 2, 150 + LINE_W / 2, 118 - LINE_W, 22 - LINE_W);
    // 고양이 (누워 있음)
    ctx.beginPath(); ctx.ellipse(104, 116, 44, 26, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.arc(72, 104, 26, 0, Math.PI * 2); strokeFill(ctx, m.c1);

    ctx.beginPath(); ctx.moveTo(146, 118); ctx.quadraticCurveTo(178, 110, 168, 88 + Math.sin(t * 4) * 6); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();
    ctx.lineWidth = 3.5; ctx.strokeStyle = m.c1; ctx.stroke();
    ctx.fillStyle = m.c2; for (const [x, y] of [[100, 108], [122, 120]]) { ellipsePath(ctx, x, y, 9, 6); ctx.fill(); }

  flame(ctx, m, t) {
    const f = Math.sin(t * 8) * 6;

    ctx.beginPath(); ctx.moveTo(100, 78 - f * 0.5); ctx.bezierCurveTo(124, 105, 134, 125, 128, 148); ctx.bezierCurveTo(118, 168, 82, 168, 72, 148);

    eyes(ctx, m, 100, 122, 18, 4.5, m._blink); mouth(ctx, 100, 142, 7, 'o');
  },
  rabbit(ctx, m, t) {
    const hop = Math.abs(Math.sin(t * 3)) * -6;
    ctx.save(); ctx.translate(0, hop);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(100 + s * 18, 62, 12, 34, s * 0.12, 0, Math.PI * 2); strokeFill(ctx, m.c1); ellipsePath(ctx, 100 + s * 18, 66, 5, 22); ctx.fillStyle = '#ffc2d6'; ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(100, 140, 46, 34, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.arc(100, 104, 34, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    // 초승달 무늬
    ctx.beginPath(); ctx.arc(128, 134, 10, 0, Math.PI * 2); ctx.fillStyle = m.c2; ctx.fill();
    ctx.beginPath(); ctx.arc(132, 131, 9, 0, Math.PI * 2); ctx.fillStyle = m.c1; ctx.fill();
    eyes(ctx, m, 100, 104, 14, 4.5, m._blink); mouth(ctx, 100, 118, 5, 'w'); blush(ctx, 100, 116, 24);
    ctx.restore();
  },
  whale(ctx, m, t) {
    const bob = Math.sin(t * 1.5) * 5;
    ctx.save(); ctx.translate(0, bob);
    ctx.beginPath(); ctx.moveTo(30, 112); ctx.bezierCurveTo(40, 70, 120, 62, 150, 90); ctx.bezierCurveTo(166, 104, 166, 130, 148, 146);
    ctx.bezierCurveTo(120, 166, 50, 160, 30, 128); ctx.closePath(); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.moveTo(150, 100); ctx.quadraticCurveTo(178, 96, 186, 78); ctx.quadraticCurveTo(180, 100, 186, 120); ctx.quadraticCurveTo(178, 108, 150, 108); ctx.closePath(); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.moveTo(34, 128); ctx.bezierCurveTo(60, 150, 120, 154, 146, 136); ctx.bezierCurveTo(120, 160, 60, 156, 34, 128); ctx.fillStyle = '#dfe6ff'; ctx.fill();
    // 별자리
    ctx.fillStyle = '#fff6b0'; for (const [x, y] of [[70, 88], [92, 80], [114, 86], [128, 98], [104, 100]]) { ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2); ctx.fill(); }
    ctx.beginPath(); ctx.moveTo(70, 88); ctx.lineTo(92, 80); ctx.lineTo(114, 86); ctx.lineTo(128, 98); ctx.lineTo(104, 100); ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,246,176,.7)'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(78, 68); ctx.quadraticCurveTo(70, 46, 84, 40); ctx.quadraticCurveTo(80, 54, 90, 66); ctx.lineWidth = 3; ctx.strokeStyle = '#bfe4ff'; ctx.stroke();
    eyes(ctx, m, 62, 108, 0, 5, m._blink); mouth(ctx, 80, 124, 10, 'w');
    ctx.restore();
  },
  duck(ctx, m, t) {
    // 오리무중: 안개 속 오리
    for (let i = 0; i < 3; i++) { ctx.save(); ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.ellipse(100 + Math.sin(t + i) * 10, 150 + i * 6, 70 - i * 10, 16, 0, 0, Math.PI * 2); ctx.fillStyle = '#cfd8e0'; ctx.fill(); ctx.restore(); }
    ctx.beginPath(); ctx.ellipse(104, 132, 46, 30, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.moveTo(140, 122); ctx.quadraticCurveTo(170, 108, 160, 90); ctx.quadraticCurveTo(156, 112, 138, 128); ctx.closePath(); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.arc(72, 96, 26, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.moveTo(50, 98); ctx.lineTo(24, 104); ctx.lineTo(50, 112); ctx.closePath(); strokeFill(ctx, m.c2);
    eyes(ctx, m, 66, 92, 8, 4, m._blink);
    ctx.save(); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.ellipse(100 + Math.sin(t * 1.3) * 12, 108, 60, 14, 0, 0, Math.PI * 2); ctx.fillStyle = '#e6edf3'; ctx.fill(); ctx.restore();
  },
  cow(ctx, m, t) {
    ctx.beginPath(); ctx.ellipse(100, 136, 50, 34, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.fillStyle = m.c2; for (const [x, y, r] of [[78, 140, 12], [124, 150, 9]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(100, 92, 36, 30, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(100 + s * 40, 84, 14, 8, s * 0.3, 0, Math.PI * 2); strokeFill(ctx, m.c1);
      ctx.beginPath(); ctx.moveTo(100 + s * 22, 66); ctx.quadraticCurveTo(100 + s * 34, 52, 100 + s * 26, 44); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#e8d3b0'; ctx.stroke();
    }

    ctx.save(); ctx.translate(146, 78); ctx.rotate(0.6 + Math.sin(t * 2) * 0.05);

    ctx.beginPath(); ctx.ellipse(100, 106, 22, 12, 0, 0, Math.PI * 2); strokeFill(ctx, '#f0c9c0');
    ctx.fillStyle = INK; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(100 + s * 8, 106, 2.5, 0, Math.PI * 2); ctx.fill(); }
    eyes(ctx, m, 100, 86, 16, 4.5, m._blink);
  },
  bird(ctx, m, t) {
    // 어부지리: 도요새 + 조개
    ctx.beginPath(); ctx.moveTo(100, 100); ctx.quadraticCurveTo(70, 112, 62, 148); ctx.quadraticCurveTo(100, 160, 138, 146); ctx.quadraticCurveTo(136, 110, 100, 100); ctx.closePath(); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.moveTo(136, 130); ctx.quadraticCurveTo(170, 120, 176, 96); ctx.quadraticCurveTo(160, 118, 132, 122); ctx.closePath(); strokeFill(ctx, m.c2);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(100 + s * 8, 156); ctx.lineTo(100 + s * 8, 176); ctx.moveTo(100 + s * 8, 176); ctx.lineTo(100 + s * 16, 178); ctx.lineWidth = 3.5; ctx.strokeStyle = m.c2; ctx.lineCap = 'round'; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(96, 82, 26, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.moveTo(72, 84); ctx.lineTo(28, 96); ctx.lineTo(72, 92); ctx.closePath(); strokeFill(ctx, '#e0a94a');
    // 조개
    ctx.save(); ctx.translate(34, 96); ctx.rotate(Math.sin(t * 6) * 0.15);

  snake(ctx, m, t) {
    // 용두사미: 용 머리, 뱀 꼬리
    ctx.beginPath(); ctx.moveTo(150, 110);
    for (let i = 0; i <= 20; i++) { const p = i / 20; ctx.lineTo(150 + p * 34 - Math.pow(p, 2) * 20, 110 + Math.sin(p * 6 + t * 3) * 10 * (1 - p) + p * 40); }
    ctx.lineWidth = 14; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineWidth = 8; ctx.strokeStyle = m.c1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(110, 128, 44, 30, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);
    ctx.beginPath(); ctx.ellipse(110, 140, 30, 12, 0, 0, Math.PI * 2); ctx.fillStyle = '#e8f7d9'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(74, 92, 34, 28, 0, 0, Math.PI * 2); strokeFill(ctx, m.c1);

    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(74 + s * 14, 68); ctx.quadraticCurveTo(74 + s * 26, 50, 74 + s * 34, 56); ctx.quadraticCurveTo(74 + s * 26, 62, 74 + s * 18, 74); ctx.closePath(); strokeFill(ctx, '#f6d36b'); }
    ctx.beginPath(); ctx.moveTo(52, 112); ctx.quadraticCurveTo(44, 130, 34, 128); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(60, 114); ctx.quadraticCurveTo(58, 134, 48, 136); ctx.stroke();
    eyes(ctx, m, 72, 90, 12, 4.5, m._blink);
  },
  dragon(ctx, m, t) {
    // 화룡점정: 붓으로 그린 듯한 용 (S자 몸통)
    const w = Math.sin(t * 2) * 4;
    const bodyPath = () => { ctx.beginPath(); ctx.moveTo(70, 118); ctx.bezierCurveTo(120, 60 + w, 190, 110 - w, 150, 150); ctx.bezierCurveTo(120, 178, 80, 160 + w, 96, 172); };
    bodyPath(); ctx.lineWidth = 30; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();
    bodyPath(); ctx.lineWidth = 22; ctx.strokeStyle = m.c1; ctx.stroke();
    bodyPath(); ctx.lineWidth = 7; ctx.strokeStyle = '#ffd9a0'; ctx.setLineDash([10, 6]); ctx.stroke(); ctx.setLineDash([]);
    // 등지느러미
    for (const [x, y, a] of [[104, 76 + w, -0.5], [128, 70 + w, -0.1], [152, 82, 0.4], [168, 106, 0.9]]) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(-7, 6); ctx.lineTo(0, -14); ctx.lineTo(7, 6); ctx.closePath(); strokeFill(ctx, m.c2); ctx.restore(); }

const SAVE_KEY = 'geulmon.save.v2';
const OLD_SAVE_KEY = 'geulmon.save.v1';

function defaultSave() {
  return {
    v: 2, name: '', team: null, xp: 0, level: 1, dust: 0, coins: 0, coinDay: '', coinToday: 0,
    items: { ball1: 30, berry1: 5, potion1: 5, egg2: 1 }, bagCap: 350, boxCap: 300,
    monsters: [], eggs: [], incubators: [{ uid: 'inc0', uses: Infinity }], buddy: null,
    candy: {}, dex: {}, stats: {}, daily: { catchDay: '', catchStreak: 0, spinDay: '', spinStreak: 0 },
    stopUsed: {}, gyms: {}, taken: {}, journal: [], effects: {}, lures: {},
    settings: { ar: true, sfx: true }, welcomed: false, createdAt: Date.now(), lastPos: null, walkAcc: 0,
    tutorial: {}, friends: [], pvp: { wins: 0, losses: 0 }, tradesDone: {},

}
let S = defaultSave();

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { S = Object.assign(defaultSave(), JSON.parse(raw)); }
    else {
      const old = localStorage.getItem(OLD_SAVE_KEY);
      if (old) migrateV1(JSON.parse(old));
    }
  } catch (e) {}
  // JSON은 Infinity를 잃어버림 → 기본 부화기 복구
  for (const inc of S.incubators) if (inc.uid === 'inc0' || inc.uses === null) inc.uses = Infinity;
  if (!S.incubators.some(i => i.uses === Infinity)) S.incubators.unshift({ uid: 'inc0', uses: Infinity });
  for (const m of S.monsters) if (m.hp == null) m.hp = instMaxHP(m);
}

  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S, (k, v) => v === Infinity ? null : v)); } catch (e) {}
}
function migrateV1(old) {
  S = defaultSave();
  S.name = old.name || ''; S.welcomed = !!old.welcomed;
  S.items.ball1 = Math.max(30, old.orbs || 0);
  let xp = 0; for (let l = 1; l < (old.level || 1); l++) xp += LEVEL_XP[l]; xp += old.xp || 0;
  for (const [id, n] of Object.entries(old.caught || {})) {
    if (!MON[id]) continue;
    for (let i = 0; i < Math.min(n, 5); i++) S.monsters.push(makeInstance(id, 5 + Math.floor(Math.random() * 10)));
    S.dex[id] = { seen: n, caught: n }; S.candy[MON[id].family] = (S.candy[MON[id].family] || 0) + 3 * n;
    S.stats.catches = (S.stats.catches || 0) + n;
  }
  S.stats.throws = old.throws || 0;

}

  const ups = [];

    S.xp -= xpNeeded(S.level); S.level++;
    const r = levelReward(S.level); for (const [id, q] of Object.entries(r)) S.items[id] = (S.items[id] || 0) + q;
    ups.push({ level: S.level, reward: r });

}

// ---- 하루 키 / 일일 보너스 ----
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

  const today = todayKey();
  if (S.daily[dayK] === today) return null;
  S.daily[stK] = S.daily[dayK] === yesterdayKey() ? Math.min(7, S.daily[stK] + 1) : 1;
  S.daily[dayK] = today;
  const seven = S.daily[stK] === 7;

  if (kind === 'spin' && seven) { bonus.items = { ball2: 5, berry3: 1 }; for (const [id, q] of Object.entries(bonus.items)) addItem(id, q); }

}

const geo = { lat: null, lng: null, acc: null, ok: false, virtual: false, heading: 0, headingSrc: null, speed: 0, fallback: { lat: 37.5013, lng: 127.0396 } };

// ---- 좌표 변환 ----

function hourSlot() { return Math.floor(Date.now() / 3600000); }

// ---- 스폰 ----
const CELL = 0.0005, SPAWN_RATE = 0.16, SPAWN_RANGE = 220;
let spawns = [], extraSpawns = [];   // extra: 향로·등불 스폰 (임시)
function pickByRarity(r, rarityShift = 0) {
  const total = SPAWN_WEIGHT.reduce((a, b) => a + b, 0);

  for (let i = 0; i < SPAWN_WEIGHT.length; i++) { if (x < SPAWN_WEIGHT[i]) { rarity = i; break; } x -= SPAWN_WEIGHT[i]; }

  const cy0 = Math.floor(lat / CELL), cx0 = Math.floor(lng / cellLng), N = 5;
  for (let dy = -N; dy <= N; dy++) for (let dx = -N; dx <= N; dx++) {
    const cy = cy0 + dy, cx = cx0 + dx, key = `${cx}_${cy}_${slot}`;
    if (S.taken[key]) continue;

    const m = pickByRarity(rand01(h, 'm'));
    if (rand01(h, 'p') > SPAWN_RATE * timeOfDayBias(m)) continue;
    const mlat = (cy + 0.15 + rand01(h, 'y') * 0.7) * CELL, mlng = (cx + 0.15 + rand01(h, 'x') * 0.7) * cellLng;

  for (const s of extraSpawns) { s.d = haversine(lat, lng, s.lat, s.lng); s.b = bearing(lat, lng, s.lat, s.lng); out.push(s); }

    const a = Math.random() * Math.PI * 2, dist = 10 + Math.random() * 18;
    const [lat, lng] = offsetLatLng(geo.lat, geo.lng, Math.cos(a) * dist, Math.sin(a) * dist);
    extraSpawns.push({ key: 'inc_' + now, id: m.id, m, lat, lng, exp: now + 5 * 60000, src: 'incense' });

// ---- 글터(스탑) · 서당(체육관) ----
const STOP_CELL = 0.0014, STOP_RATE = 0.5, GYM_CELL = 0.0036, GYM_RATE = 0.4;
let stops = [], gyms = [];
function stopName(h) { return `${STOP_PREFIX[hash32(h + 'a') % STOP_PREFIX.length]} ${STOP_WORDS[hash32(h + 'b') % STOP_WORDS.length]}`; }
function computePOIs() {

    const cellLng = cell / Math.max(0.2, cosL); const cy0 = Math.floor(lat / cell), cx0 = Math.floor(lng / cellLng);
    for (let dy = -N; dy <= N; dy++) for (let dx = -N; dx <= N; dx++) {
      const cy = cy0 + dy, cx = cx0 + dx, key = `${kind}${cx}_${cy}`, h = String(hash32(key));
      if (rand01(h, 'p') > rate) continue;

      const d = haversine(lat, lng, plat, plng); if (d > 600) continue;

      else { o.name = `${STOP_PREFIX[hash32(h + 'g') % STOP_PREFIX.length]} ${GYM_WORDS[hash32(h + 'w') % GYM_WORDS.length]}`; }

  for (let i = 0; i < n; i++) {
    const pool = MONSTERS.filter(m => m.stage >= 1 && m.rarity <= 2);
    const m = pool[hash32(g.h + 'd' + i) % pool.length];
    const lvl = 8 + hash32(g.h + 'l' + i) % 18; const iv = [hash32(g.h + 'a' + i) % 16, hash32(g.h + 'b' + i) % 16, hash32(g.h + 'c' + i) % 16];

// ---- 위치 ----
let geoWatch = null, lastFix = null;

    const { latitude: lat, longitude: lng, accuracy: acc, heading, speed } = p.coords;
    if (geo.ok && lastFix) {
      const d = haversine(lastFix.lat, lastFix.lng, lat, lng), dt = (p.timestamp - lastFix.t) / 1000;
      const v = dt > 0 ? d / dt : 0;
      if (acc < 60 && d > 3 && v < 3.2) onWalked(d);        // 걷는 속도(≈11 km/h 미만)만 인정
      if (heading != null && !isNaN(heading) && v > 0.8 && ORI.headingSrc !== 'sensor') geo.heading = heading;
      geo.speed = v;
    }
    lastFix = { lat, lng, t: p.timestamp };

    setPermState('geo', true); onPositionChanged();

}

}
function onPositionChanged() {

}
// 가상 모드에서 조이스틱처럼 이동 (테스트용)
function virtualMove(dNorth, dEast) {

function onWalked(d) {

let mapDrag = null;

      drawMonster(ctx, E.m, E.mx, E.my, msz, t, { blink: E.blink, tilt: { x: gx, y: gy }, light: { x: -0.45 + gx * 0.5, y: -0.5 + gy * 0.4 }, height: bobH });

      ctx.fillText('CP ' + E.cp, E.mx + 1, E.my - E.msize * 0.5 - 6 + 1); ctx.fillStyle = '#fff'; ctx.fillText('CP ' + E.cp, E.mx, E.my - E.msize * 0.5 - 6);

// ---- 입력 ----
stage.addEventListener('pointerdown', e => {
  if (E.phase !== 'aim' || itemCount(E.ball) <= 0) return;
  const r = stage.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.hypot(x - E.W / 2, y - (E.H - 120)) > 70) return;
  E.drag = { x, y, pts: [{ x, y, t: performance.now() }] }; stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => { if (!E.drag) return; const r = stage.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; E.drag.x = x; E.drag.y = y; E.drag.pts.push({ x, y, t: performance.now() }); if (E.drag.pts.length > 24) E.drag.pts.shift(); });
function endDrag() {
  if (!E.drag) return; const d = E.drag; E.drag = null; const pts = d.pts;
  const a = pts[Math.max(0, pts.length - 5)], b = pts[pts.length - 1]; const dt = Math.max(16, b.t - a.t);
  const vy = (b.y - a.y) / dt, vx = (b.x - a.x) / dt;
  if (vy > -0.35) return;

  let cross = 0; for (let i = 2; i < pts.length; i++) { const ax = pts[i - 1].x - pts[i - 2].x, ay = pts[i - 1].y - pts[i - 2].y, bx = pts[i].x - pts[i - 1].x, by = pts[i].y - pts[i - 1].y; cross += ax * by - ay * bx; }

}
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

function throwOrb(x, y, vx, vy, curve, curveDir) {
  useItem(E.ball, 1); E.throws++; addStat('throws'); save(); updateArHud();
  const power = Math.max(0.3, Math.min(1.5, -vy / 1.6));
  const y1 = y - power * E.H * 0.55;
  const x1 = x + Math.max(-E.W * 0.6, Math.min(E.W * 0.6, vx * 420)) - (curve ? curveDir * E.W * 0.12 : 0);
  E.orb = { x0: x, y0: y, x1, y1, r0: 38, arc: E.H * 0.16 * power, t0: performance.now(), dur: 720, curve, curveDir };
  E.trail = []; E.phase = 'fly'; hintEl.textContent = '';
}
function resolveThrow(x, y, now, attacking) {

    hintEl.textContent = itemCount(E.ball) <= 0 ? (bestBall() ? '다른 구슬로 바꿔 보세요' : '구슬이 없어요') : (Math.random() < 0.5 ? '조금 더 세게, 글몬을 향해' : '링이 작을 때 맞히면 더 잘 잡혀요');
    return;
  }
  const ringR = hitR * (0.2 + 0.8 * E.ring);
  const grade = dist <= ringR ? throwGrade(E.ring) : null;
  const p = catchProb(E.m, E.level, { ball: ITEMS[E.ball].mult, berry: berry ? ITEMS[berry].mult : 1, curve: E.orb.curve, throwMult: grade ? grade.mult : 1, medal: medalBonusForTypes(E.m.types) });
  const success = Math.random() < p;
  const n = success ? 3 : 1 + Math.floor(Math.random() * 3);
  if (grade) { toast(grade.name + '!', 1000); if (grade.name === 'Excellent') addStat('excellent'); }
  burst(E.mx, E.my, ['#fff3c4', '#ffbe55', '#7fe0a6'], 26);
  E.phase = 'suck'; E.suck = { x, y, t0: now };

}
function burst(x, y, colors, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4; E.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: 2 + Math.random() * 4, c: colors[i % colors.length], a: 1 }); } }
function finishShake(now) {

}

const GYM_HOLD_MS = 8 * 3600000;       // 8시간 뒤 NPC가 되찾음
const COIN_PER_10MIN = 1, COIN_DAY_CAP = 50;

function gymTick() {
  const now = Date.now(); let changed = false;
  for (const [key, g] of Object.entries(S.gyms)) {
    if (g.owner !== 'me') continue;
    const held = now - g.since;
    if (held >= GYM_HOLD_MS) { returnFromGym(key, g, true); changed = true; }
  }
  if (changed) save();
}
function coinsAccrued(g) { return Math.min(COIN_DAY_CAP, Math.floor((Date.now() - g.since) / 600000) * COIN_PER_10MIN); }
function claimCoins(n) {
  if (S.coinDay !== todayKey()) { S.coinDay = todayKey(); S.coinToday = 0; }
  const room = Math.max(0, COIN_DAY_CAP - S.coinToday); const got = Math.min(room, n);
  S.coins += got; S.coinToday += got; return got;
}
function returnFromGym(key, g, byNpc) {
  const got = claimCoins(coinsAccrued(g));
  for (const uid of g.mine || []) { const inst = getMonster(uid); if (inst) { delete inst.atGym; inst.hp = Math.max(1, Math.floor(instMaxHP(inst) * 0.5)); } }
  delete S.gyms[key];
  journal(`${g.name}에서 글몬이 돌아왔다 · 엽전 ${got}개`, 'coin');
  if (byNpc) toast(`${g.name}을(를) 다른 트레이너가 차지했어요. 엽전 ${got}개를 받았습니다`, 2500);
}

// ---- 배틀 팀 선택 ----

// ---- 배틀 ----
const B = { mode: 'gym', active: false, raf: 0, g: null, gs: null, team: [], ti: 0, di: 0, energy: 0, dEnergy: 0, lastTap: 0, dodgeUntil: 0, dTel: 0, dNext: 0, particles: [], log: [], t0: 0, shakeMe: 0, shakeDef: 0, won: null, defHp: [] };

  document.getElementById('b-team').innerHTML = B.team.map((t, i) => `<span class="${i === B.ti ? 'on' : ''} ${t.hp <= 0 ? 'ko' : ''}"></span>`).join('');
}
function battleLoop(now) {

  // 배경: 서당 마당
  const g = ctx.createLinearGradient(0, 0, 0, bH); g.addColorStop(0, '#2a4a63'); g.addColorStop(0.5, '#3d6a52'); g.addColorStop(1, '#1e3a2a'); ctx.fillStyle = g; ctx.fillRect(0, 0, bW, bH);

  // 수비수 (위) / 내 글몬 (아래, 뒤집기)
  if (d) { const dx = bW * 0.62 + (B.shakeDef > now ? (Math.random() - 0.5) * 12 : 0); const dy = bH * 0.32 + (B.dTel > now ? -12 : 0); drawMonster(ctx, MON[d.id], dx, dy, Math.min(bW, bH) * 0.42, t, { flip: true, light: { x: -0.4, y: -0.6 }, height: B.dTel > now ? 0.3 : 0.05 }); if (B.dTel > now) { ctx.beginPath(); ctx.arc(dx, dy, Math.min(bW, bH) * 0.24, 0, Math.PI * 2); ctx.strokeStyle = '#ff6f61'; ctx.lineWidth = 4; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]); } }
  if (m) { const mx = bW * 0.34 + (B.shakeMe > now ? (Math.random() - 0.5) * 12 : 0) + (B.dodgeUntil > now ? Math.sin((B.dodgeUntil - now) / 500 * Math.PI) * -70 * B.dodgeDir : 0); drawMonster(ctx, MON[m.id], mx, bH * 0.66, Math.min(bW, bH) * 0.5, t, { light: { x: -0.4, y: -0.6 }, height: B.dodgeUntil > now ? 0.25 : 0.05 }); }
  for (const q of B.particles) { q.x += q.vx; q.y += q.vy; q.a -= 0.03; ctx.globalAlpha = Math.max(0, q.a); ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fillStyle = q.c; ctx.fill(); }
  ctx.globalAlpha = 1; B.particles = B.particles.filter(q => q.a > 0);

// =====================================================================
//  모션 배틀: 폰을 흔들어 차지 기술 발동 · 기울여서 회피
//  가속도(devicemotion) + 방향(deviceorientation, ORI.raw.gamma) 사용
// =====================================================================
const MOTION = {
  on: false,            // 리스너 붙음
  have: false,          // 실제 센서 값이 들어옴
  lastShake: 0, count: 0, windowEnd: 0, windowStart: 0,   // 흔들기 창
  baseGamma: null, tiltArmed: false, lastTiltHint: 0,
  peak: 0,
};
const SHAKE_G = 13;               // m/s² — 이보다 크면 한 번 흔든 것으로
const SHAKE_GAP = 130;            // ms — 연속 감지 최소 간격
const SHAKE_WINDOW = 1200;        // ms — 첫 흔들기부터 발동까지
const TILT_ON = 24, TILT_OFF = 10; // deg — 회피 발동/해제 (히스테리시스)

function motionEnabled() { return S.settings.motion !== false; }

function onMotion(e) {
  let a = e.acceleration;
  // 중력 제외 값이 없는 기기: 중력 포함 값에서 9.8을 뺀 근사
  if (!a || (a.x == null && a.y == null && a.z == null)) { const g = e.accelerationIncludingGravity; if (!g) return; const mag = Math.hypot(g.x || 0, g.y || 0, g.z || 0); MOTION.have = true; return registerAccel(Math.abs(mag - 9.81)); }

}
function registerAccel(mag) {
  if (!B.active || B.won != null || !motionEnabled()) return;

  MOTION.lastShake = now;
  const m = me(); if (!m) return;
  const ch = MOVES[m.charged];
  if (B.energy < ch.energy) { if (now - MOTION.lastTiltHint > 1500) { MOTION.lastTiltHint = now; floatText('에너지가 아직 부족!', bW * 0.5, bH * 0.6, '#97a5b2'); } return; }

}

    const d = g - MOTION.baseGamma;

function useBagItem(id) {

  if (it.cat === 'heal') pickMonster('회복할 글몬', i => i.hp > 0 && i.hp < instMaxHP(i), i => { useItem(id); i.hp = Math.min(instMaxHP(i), i.hp + it.heal); save(); toast(`${instName(i)} HP ${i.hp}`); renderBag(); });
  else if (it.cat === 'revive') pickMonster('되살릴 글몬', i => i.hp <= 0, i => { useItem(id); i.hp = Math.floor(instMaxHP(i) / 2); save(); toast(`${instName(i)}이(가) 깨어났어요`); renderBag(); });
  else if (id === 'incense' || id === 'luckyegg') { if (!useItem(id)) return; S.effects[id] = Date.now() + 30 * 60000; save(); toast(id === 'incense' ? '향로를 피웠어요 · 30분' : '행운의 알 · 30분 동안 XP 2배'); journal(`${it.name}을(를) 사용했다`, id); renderBag(); updateHud(); }

}

// ---- 글터 ----
function openStop(st, near) {
  const ready = stopReady(st); const lured = S.lures[st.key] > Date.now();
  let html = `<h3>${st.name}</h3><p class="sub">글터 · ${fmtDist(st.d)}${lured ? ` · 꽃향 등불 ${fmtMs(S.lures[st.key] - Date.now())} 남음` : ''}</p><div class="stop-disc" id="disc"><canvas id="disc-c"></canvas><div class="lbl">${near ? (ready ? '원판을 돌려 아이템을 받으세요' : `${fmtMs(5 * 60000 - (Date.now() - S.stopUsed[st.key]))} 뒤에 다시`) : '가까이 가면 돌릴 수 있어요'}</div></div>`;
  html += `<div class="btns" style="margin-top:30px"><button class="btn ghost" onclick="closeSheet()">닫기</button>${near && !lured && itemCount('lure') ? `<button class="btn warm" id="btn-lure">꽃향 등불 걸기 (${itemCount('lure')})</button>` : ''}</div>`;
  openSheet(html);
  const c = $('#disc-c'); const dpr = Math.min(2, window.devicePixelRatio || 1); c.width = 180 * dpr; c.height = 180 * dpr; const cx = c.getContext('2d');
  let rot = 0, spun = 0, last = null; const state = lured ? 'lured' : ready ? 'ready' : 'cooldown';
  const draw = () => { cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, 180, 180); cx.save(); cx.translate(90, 90); cx.rotate(rot); cx.beginPath(); cx.arc(0, 0, 86, 0, Math.PI * 2); cx.fillStyle = ready ? '#1f3d5c' : '#2a2a3a'; cx.fill(); cx.lineWidth = 6; cx.strokeStyle = ready ? '#4fa8ff' : '#5a5a70'; cx.stroke(); cx.translate(-50, -50); cx.scale(1, 1); drawStopIcon(cx, state); cx.restore(); cx.fillStyle = 'rgba(255,255,255,.6)'; cx.font = '12px sans-serif'; cx.textAlign = 'center'; cx.fillText(st.name, 90, 170); };
  draw();
  const disc = $('#disc');
  disc.addEventListener('pointerdown', e => { last = Math.atan2(e.clientY - (disc.getBoundingClientRect().top + 90), e.clientX - (disc.getBoundingClientRect().left + 90)); disc.setPointerCapture(e.pointerId); });
  disc.addEventListener('pointermove', e => { if (last == null) return; const r = disc.getBoundingClientRect(); const a = Math.atan2(e.clientY - (r.top + 90), e.clientX - (r.left + 90)); let d = a - last; if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; rot += d; spun += Math.abs(d); last = a; draw(); if (spun > Math.PI * 0.9 && near && ready) { last = null; spun = -1e9; spinStop(st); } });
  disc.addEventListener('pointerup', () => { last = null; }); disc.addEventListener('pointercancel', () => { last = null; });
  const lb = $('#btn-lure'); if (lb) lb.onclick = () => { useItem('lure'); S.lures[st.key] = Date.now() + 30 * 60000; save(); journal(`${st.name}에 꽃향 등불을 걸었다`, 'lure'); closeSheet(); toast('꽃향 등불을 걸었어요 · 30분'); };
}
function spinStop(st) {
  const first = !stat('spins'); addStat('spins'); S.stopUsed[st.key] = Date.now();
  const n = 3 + Math.floor(Math.random() * 4); const got = {};
  const table = [['ball1', 50], ['potion1', 12], ['potion2', S.level >= 10 ? 8 : 0], ['berry1', 12], ['berry2', 6], ['revive', S.level >= 5 ? 6 : 0], ['ball2', S.level >= 12 ? 10 : 0], ['ball3', S.level >= 20 ? 5 : 0], ['berry3', 1]];
  const tot = table.reduce((a, b) => a + b[1], 0);
  for (let i = 0; i < n; i++) { let r = Math.random() * tot; for (const [id, w] of table) { if (r < w) { got[id] = (got[id] || 0) + 1; break; } r -= w; } }
  const eggs = itemCount('egg2') + itemCount('egg5') + itemCount('egg10');
  if (eggs < 9 && Math.random() < 0.22) { const r = Math.random(); const id = r < 0.55 ? 'egg2' : r < 0.9 ? 'egg5' : 'egg10'; got[id] = 1; }
  if (Math.random() < 0.02) got.incubator = 1; if (Math.random() < 0.03) got.lure = 1;
  const full = bagFull(); if (full) { for (const id of Object.keys(got)) if (ITEMS[id].cat !== 'egg') delete got[id]; }
  for (const [id, q] of Object.entries(got)) addItem(id, q);
  const lines = [['글터 방문', first ? 100 : 50]]; const daily = dailyBonus('spin'); if (daily) lines.push([daily.seven ? '7일 연속 첫 글터' : '오늘의 첫 글터', daily.xp]);
  const xp = lines.reduce((a, b) => a + b[1], 0); grantXp(xp); save(); updateHud();
  let html = `<h3>${st.name}</h3><p class="sub">${full ? '가방이 가득 차서 아이템을 받지 못했어요' : '아이템을 받았어요'}</p><div class="reward-row">`;
  for (const [id, q] of Object.entries(got)) html += `<div class="rw" data-item="${id}">×${q} ${ITEMS[id].name}</div>`;
  html += `</div><div class="xp-lines">${lines.map(l => `<div><span>${l[0]}</span><span>+${l[1]} XP</span></div>`).join('')}${daily && daily.items ? `<div><span>7일 보너스 아이템</span><span>큰글구슬 5 · 금열매 1</span></div>` : ''}</div><div class="btns"><button class="btn" onclick="closeSheet(); flushQueues()">확인</button></div>`;
  openSheet(html); for (const el of sheet.querySelectorAll('[data-item]')) el.prepend(itemIcon(el.dataset.item, 28));
}

//  네트워크 계층 — Firebase Realtime Database REST + SSE
//  SDK 없이 fetch / EventSource 만 사용. 설정이 없으면 완전 오프라인으로 동작.
// =====================================================================


const NET = {
  cfg: null, uid: null, token: null, refresh: null, expAt: 0,
  state: 'off',           // off | connecting | on | error
  error: '', streams: {}, listeners: {}, lastPing: 0, retry: 0, blocked: false,
};

function netCfg() {
  try { const raw = localStorage.getItem('geulmon.server'); if (raw) { const c = JSON.parse(raw); if (c && c.apiKey && c.databaseURL) return c; } } catch (e) {}
  if (SERVER_CONFIG.apiKey && SERVER_CONFIG.databaseURL) return Object.assign({}, SERVER_CONFIG);
  return null;
}
function netSaveCfg(c) { try { localStorage.setItem('geulmon.server', JSON.stringify(c)); } catch (e) {} }
function netClearCfg() { try { localStorage.removeItem('geulmon.server'); } catch (e) {} }
function netOn() { return NET.state === 'on'; }
function netRoot() { return `${NET.cfg.databaseURL.replace(/\/$/, '')}/g/${encodeURIComponent(NET.cfg.group || 'yujung')}`; }
function netUrl(path, extra) { return `${netRoot()}${path ? '/' + path : ''}.json?auth=${encodeURIComponent(NET.token)}${extra || ''}`; }

// 붙여넣은 텍스트에서 설정 뽑아내기 (JSON이든 firebaseConfig 코드든)
function parseServerConfig(text) {
  const out = {};
  const pick = k => { const m = text.match(new RegExp('["\']?' + k + '["\']?\\s*[:=]\\s*["\']([^"\']+)["\']')); return m ? m[1] : ''; };
  out.apiKey = pick('apiKey');
  out.databaseURL = pick('databaseURL');

// ---- 인증 ----
async function netAuth() {
  const c = NET.cfg;
  const r = await fetch(`${c.authBase || 'https://identitytoolkit.googleapis.com'}/v1/accounts:signUp?key=${encodeURIComponent(c.apiKey)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || '로그인 실패');
  NET.uid = j.localId; NET.token = j.idToken; NET.refresh = j.refreshToken; NET.expAt = Date.now() + (+j.expiresIn - 120) * 1000;
  try { localStorage.setItem('geulmon.uid', JSON.stringify({ uid: j.localId, refresh: j.refreshToken })); } catch (e) {}
}
async function netRefresh() {
  const c = NET.cfg;

  const r = await fetch(`${c.tokenBase || 'https://securetoken.googleapis.com'}/v1/token?key=${encodeURIComponent(c.apiKey)}`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || '토큰 갱신 실패');
  NET.token = j.id_token || j.access_token; NET.refresh = j.refresh_token || NET.refresh; NET.uid = j.user_id || NET.uid;
  NET.expAt = Date.now() + (+(j.expires_in || 3000) - 120) * 1000;
  try { localStorage.setItem('geulmon.uid', JSON.stringify({ uid: NET.uid, refresh: NET.refresh })); } catch (e) {}
}
async function netEnsureToken() { if (Date.now() > NET.expAt) { if (NET.refresh) await netRefresh(); else await netAuth(); restartStreams(); } }

// ---- 연결 ----
async function netConnect(silent) {
  const c = netCfg();
  if (!c) { NET.state = 'off'; NET.error = ''; updateNetBadge(); return false; }
  NET.cfg = c; NET.state = 'connecting'; NET.error = ''; updateNetBadge();
  try {
    let saved = null; try { saved = JSON.parse(localStorage.getItem('geulmon.uid') || 'null'); } catch (e) {}
    if (saved && saved.refresh) { NET.refresh = saved.refresh; NET.uid = saved.uid; await netRefresh(); }
    else await netAuth();
    await netPut('players/' + NET.uid + '/hello', Date.now());   // 쓰기 권한 확인
    NET.state = 'on'; NET.retry = 0; NET.blocked = false;
    onNetUp();
    if (!silent) toast('서버에 연결됐어요');
  } catch (e) {
    NET.state = 'error';
    NET.error = String(e && e.message || e);
    if (/Failed to fetch|NetworkError|Load failed/i.test(NET.error)) { NET.blocked = true; NET.error = '서버에 연결할 수 없어요 (인터넷 또는 보안 정책)'; }
    if (/PERMISSION_DENIED/i.test(NET.error)) NET.error = '데이터베이스 규칙에서 쓰기가 막혀 있어요';
    if (/API_KEY|CONFIGURATION|INVALID/i.test(NET.error)) NET.error = '설정값(apiKey)이 올바르지 않아요';
    if (/ADMIN_ONLY_OPERATION|OPERATION_NOT_ALLOWED/i.test(NET.error)) NET.error = 'Firebase에서 익명 로그인을 켜 주세요';
  }
  updateNetBadge();

}

// ---- REST ----
async function netReq(method, path, data, extra) {
  await netEnsureToken();
  const opt = { method };
  if (data !== undefined) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(data); }
  const r = await fetch(netUrl(path, extra), opt);
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(`${r.status} ${t.slice(0, 120)}`); }
  const txt = await r.text();
  return txt && txt !== 'null' ? JSON.parse(txt) : null;
}
const netGet = (p, extra) => netReq('GET', p, undefined, extra);
const netPut = (p, d) => netReq('PUT', p, d);
const netPatch = (p, d) => netReq('PATCH', p, d);
const netPush = (p, d) => netReq('POST', p, d);
const netDel = p => netReq('DELETE', p);
const SV_TS = { '.sv': 'timestamp' };

// ---- 스트리밍 (SSE) ----
// path의 변화를 실시간으로 받는다. cb(kind, path, data)
function netStream(key, path, cb) {
  netStopStream(key);
  if (!netOn() || typeof EventSource === 'undefined') return;
  let es;
  try { es = new EventSource(netUrl(path)); } catch (e) { return; }
  const rec = { es, path, cb, key };
  NET.streams[key] = rec;
  es.addEventListener('put', e => { try { const d = JSON.parse(e.data); cb('put', d.path, d.data); } catch (err) {} });
  es.addEventListener('patch', e => { try { const d = JSON.parse(e.data); cb('patch', d.path, d.data); } catch (err) {} });
  es.addEventListener('auth_revoked', () => { netStopStream(key); netEnsureToken().then(() => netStream(key, path, cb)).catch(() => {}); });
  es.onerror = () => {
    if (rec.dead) return;
    // 브라우저가 자동 재연결하지만, 닫힌 경우 직접 재시도
    if (es.readyState === 2) { rec.dead = true; setTimeout(() => { if (NET.streams[key] === rec) { delete NET.streams[key]; if (netOn()) netStream(key, path, cb); } }, 3000); }
  };
}
function netStopStream(key) { const r = NET.streams[key]; if (r) { r.dead = true; try { r.es.close(); } catch (e) {} delete NET.streams[key]; } }
function restartStreams() { const keys = Object.entries(NET.streams).map(([k, r]) => [k, r.path, r.cb]); for (const [k] of keys) netStopStream(k); for (const [k, p, cb] of keys) netStream(k, p, cb); }
function netStopAll() { for (const k of Object.keys(NET.streams)) netStopStream(k); }

// SSE의 put/patch 경로를 로컬 객체에 반영
function applyStreamEvent(store, kind, path, data) {
  if (path === '/') {
    if (kind === 'put') { for (const k of Object.keys(store)) delete store[k]; Object.assign(store, data || {}); return; }
    for (const [k, v] of Object.entries(data || {})) { const kp = k.split('/').filter(Boolean); let t = store; for (let i = 0; i < kp.length - 1; i++) { if (typeof t[kp[i]] !== 'object' || t[kp[i]] == null) t[kp[i]] = {}; t = t[kp[i]]; } if (v == null) delete t[kp[kp.length - 1]]; else t[kp[kp.length - 1]] = v; }
    return;
  }
  const parts = path.split('/').filter(Boolean);
  let o = store;
  for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (kind === 'patch') {
    if (typeof o[last] !== 'object' || o[last] == null) o[last] = {};
    for (const [k, v] of Object.entries(data || {})) {
      const kp = k.split('/').filter(Boolean); let t = o[last];
      for (let i = 0; i < kp.length - 1; i++) { if (typeof t[kp[i]] !== 'object' || t[kp[i]] == null) t[kp[i]] = {}; t = t[kp[i]]; }
      if (v == null) delete t[kp[kp.length - 1]]; else t[kp[kp.length - 1]] = v;
    }
  }
  else if (data == null) delete o[last];
  else o[last] = data;
}

function netStatusText() {
  if (NET.state === 'on') return '연결됨';
  if (NET.state === 'connecting') return '연결 중…';
  if (NET.state === 'error') return NET.error || '연결 실패';
  return '설정 안 됨';
}

async function createTrade(inst) {

  ON.tradeCode = code; ON.tradeSide = 'b'; ON.tradeMon = inst.uid;

}

async function cancelTrade() { const code = ON.tradeCode; netStopStream('trade'); if (code && ON.trade && ON.trade.state !== 'done') { try { await netPatch('trades/' + code, { state: 'cancel' }); } catch (e) {} } ON.tradeCode = null; closeSheet(); }
function completeTrade() {
  const t = ON.trade, code = ON.tradeCode; if (!t || !code || S.tradesDone[code]) return;
  const mine = ON.tradeSide === 'a' ? t.a : t.b, theirs = ON.tradeSide === 'a' ? t.b : t.a;
  if (!mine || !theirs || !theirs.mon) return;
  S.tradesDone[code] = true;
  const idx = S.monsters.findIndex(m => m.uid === mine.mon.uid);
  if (idx >= 0) { const gone = S.monsters[idx]; if (S.buddy && S.buddy.uid === gone.uid) S.buddy = null; S.monsters.splice(idx, 1); }
  const got = snapToInst(theirs.mon, { traded: true, caughtAt: Date.now() }); got.uid = 'tr' + Date.now().toString(36); got.owner = undefined; got.ownerUid = undefined;
  addMonster(got); addCandy(MON[got.id].family, 1); addStat('trades'); journal(`${theirs.name}님과 ${MON[got.id].name}을(를) 교환했다`, got.id); save();
  ON.tradeCode = null; netStopStream('trade');
  closeSheet(); openSheet(`<div class="art" id="sheet-art"></div><h3>교환 완료!</h3><p>${theirs.name}님에게서 <b>${MON[got.id].name}</b> <span class="cp">CP ${instCP(got)}</span>을(를) 받았어요. 사탕 +1</p><div class="btns"><button class="btn" onclick="closeSheet()">확인</button></div>`);
  $('#sheet-art').appendChild(monsterIcon(MON[got.id], 140, { caught: true })); updateHud();
}

  const t = ON.trade; if (!t || !ON.tradeCode) return;
  if (t.state === 'cancel') { ON.tradeCode = null; netStopStream('trade'); closeSheet(); toast('교환이 취소됐어요'); return; }
  if (t.state === 'done') return;
  const mine = ON.tradeSide === 'a' ? t.a : t.b, theirs = ON.tradeSide === 'a' ? t.b : t.a;

    <div class="arrow">⇄</div>

  await netPut(`pub/gyms/${g.key}/defenders/${inst.uid}`, snap);

function checkMyGymReturns() {
  // 서당에 두었던 내 글몬이 서버에서 사라졌으면 → 돌아온 것 (엽전 지급)

    const d = ON.gyms[inst.atGym];
    const still = d && d.defenders && d.defenders[inst.uid];

    journal(`${instName(inst)}이(가) 서당에서 돌아왔다 · 엽전 ${got}개`, 'coin'); toast(`${instName(inst)}이(가) 서당에서 돌아왔어요 · 엽전 ${got}개`, 2500); changed = true;
  }

}

  list.slice(0, 50).forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'rank-row' + (p.uid === NET.uid ? ' me' : '');
    d.innerHTML = `<div class="no ${i < 3 ? 'top' : ''}">${i + 1}</div><div class="nm">${p.team ? `<span class="dot" style="background:${TEAMS[p.team].color}"></span>` : ''}${p.name}${p.uid === NET.uid ? ' (나)' : ''}<span>Lv ${p.level} · 도감 ${p.dex || 0} · 포획 ${p.catches || 0}</span></div><div class="val">${fmtNum(v(p))}</div>`;
    rl.appendChild(d);
  });
}

// ---- 친구 ----
function renderFriendsTab(body) {
  body.innerHTML = `<div class="section-title">내 친구 코드</div><div class="big-code">${ON.myCode}</div><p class="sub" style="text-align:center">친구에게 이 코드를 알려 주세요</p>
    <div class="setup-box"><b>친구 추가</b><input id="friend-code" maxlength="6" placeholder="친구 코드 6자리" style="text-transform:uppercase"><div class="btns"><button class="btn" id="btn-friend-add">등록</button></div></div>
    <div class="section-title">친구 (${(S.friends || []).length})</div><div id="friend-list"></div>`;
  $('#btn-friend-add').onclick = () => addFriendByCode($('#friend-code').value);
  const fl = $('#friend-list');
  if (!(S.friends || []).length) fl.innerHTML = '<div class="empty">아직 친구가 없어요.</div>';
  for (const u of S.friends || []) {
    const p = ON.players[u]; const on = p && p.ts && Date.now() - p.ts < 10 * 60000;
    const d = document.createElement('div'); d.className = 'friend-row';
    d.innerHTML = `<div><span class="online-dot ${on ? 'on' : ''}"></span>${p ? p.name : '(알 수 없음)'} <span>${p ? `Lv ${p.level} · 도감 ${p.dex || 0} · ${on ? '접속 중' : '오프라인'}` : ''}</span></div><button class="btn sm ${on ? 'warm' : 'ghost'}" ${on ? '' : 'disabled'}>대전</button><button class="btn ghost sm" style="color:var(--coral)">삭제</button>`;
    d.querySelectorAll('button')[0].onclick = () => pvpInvite(u).catch(e => toast('오류: ' + e.message));
    d.querySelectorAll('button')[1].onclick = () => { S.friends = S.friends.filter(x => x !== u); save(); renderFriendsTab(body); };
    fl.appendChild(d);
  }
}

// ---- 교환 ----
function renderTradeTab(body) {
  body.innerHTML = `<div class="section-title">글몬 교환</div>
    <div class="big-btns"><button class="btn warm" id="btn-trade-new">교환 만들기<small>내 글몬을 고르고 번호 받기</small></button><button class="btn" id="btn-trade-join">번호로 참가<small>친구의 4자리 번호</small></button></div>
    <p class="sub" style="margin-top:14px">교환하면 받은 글몬의 사탕 1개를 얻습니다. 즐겨찾기·서당 배치 중인 글몬은 교환할 수 없어요. 교환한 글몬은 다시 교환할 수 없습니다.</p>`;
  const filter = i => !i.fav && !i.atGym && !i.traded;
  $('#btn-trade-new').onclick = () => pickMonster('내가 줄 글몬', filter, async inst => { try { const code = await createTrade(inst); renderTradeSheet(); toast(`교환 번호 ${code}`); } catch (e) { toast('오류: ' + e.message); } });
  $('#btn-trade-join').onclick = () => promptSheet('교환 번호 (4자리)', '', code => pickMonster('내가 줄 글몬', filter, inst => joinTrade(code.trim(), inst).then(ok => { if (ok) renderTradeSheet(); }).catch(e => toast('오류: ' + e.message))));
}

// ---- 서버 설정 ----
function openServerSetup() {
  const cfg = netCfg() || {};
  openSheet(`<h3>서버 연결</h3><p class="sub">Firebase 콘솔에서 복사한 설정(firebaseConfig)을 그대로 붙여넣으세요. apiKey와 databaseURL만 있으면 됩니다.</p>
    <div class="setup-box"><textarea id="cfg-text" placeholder='const firebaseConfig = { apiKey: "AIza…", databaseURL: "https://…firebasedatabase.app", … };'>${cfg.apiKey ? `apiKey: "${cfg.apiKey}"\ndatabaseURL: "${cfg.databaseURL}"` : ''}</textarea>
    <input id="cfg-group" placeholder="학원(반) 코드 — 같은 코드끼리 만납니다" value="${cfg.group || 'yujung'}">
    <div class="st ${NET.state === 'on' ? 'on' : NET.state === 'error' ? 'err' : ''}" id="cfg-status">${netStatusText()}${NET.uid ? ' · 내 ID ' + NET.uid.slice(0, 6) : ''}</div></div>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">닫기</button>${cfg.apiKey ? '<button class="btn ghost" id="btn-cfg-clear" style="color:var(--coral)">연결 해제</button>' : ''}<button class="btn" id="btn-cfg-save">연결</button></div>`);
  $('#btn-cfg-save').onclick = async () => {
    const parsed = parseServerConfig($('#cfg-text').value); if (!parsed) { $('#cfg-status').textContent = 'apiKey와 databaseURL을 찾지 못했어요. 콘솔의 설정을 통째로 붙여넣어 보세요.'; $('#cfg-status').className = 'st err'; return; }
    parsed.group = ($('#cfg-group').value.trim() || 'yujung').replace(/[.#$\[\]\/]/g, '');
    netSaveCfg(parsed); netStopAll(); $('#cfg-status').textContent = '연결 중…'; $('#cfg-status').className = 'st';
    const ok = await netConnect(true);
    $('#cfg-status').textContent = netStatusText() + (ok ? ' · 내 ID ' + NET.uid.slice(0, 6) : ''); $('#cfg-status').className = 'st ' + (ok ? 'on' : 'err');
    if (ok) { setTimeout(() => { closeSheet(); renderOnlineTab(); }, 800); }
  };
  const cb = $('#btn-cfg-clear'); if (cb) cb.onclick = () => { netClearCfg(); netStopAll(); NET.state = 'off'; NET.cfg = null; updateNetBadge(); closeSheet(); renderOnlineTab(); toast('서버 연결을 해제했어요'); };
}

// ===== 시작 =====
function boot() {
  load(); gymTick(); resizeMap(); updateHud();
  netConnect(true).catch(() => {});
  const wa = document.getElementById('welcome-art'); const dpr = Math.min(2, window.devicePixelRatio || 1); wa.width = 150 * dpr; wa.height = 150 * dpr;
  const wctx = wa.getContext('2d'); wctx.scale(dpr, dpr); drawMonster(wctx, MON.mongle, 75, 75, 150, 0.5, { shadow: false, ignoreScale: true }); drawOrb(wctx, 120, 114, 20, -0.4);
  if (!S.welcomed) { document.getElementById('welcome').classList.add('show'); if (S.lastPos) useVirtualLocation(''); }
  else { startGeo(); if (ORI.granted !== false && !(typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission)) startOrientation(); }
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') startMotion().catch(() => {});   // 안드로이드: 권한 불필요
  (function frame(now) { if (!E.active && !B.active) drawMap(now); requestAnimationFrame(frame); })(performance.now());
  setInterval(() => { if (geo.lat != null && !E.active) { computeSpawns(); tickEffects(); renderNearby(); } gymTick(); updateHud(); updateNetBadge(); if (!modal.classList.contains('show')) flushQueues(); }, 5000);
  setInterval(() => { if (netOn() && !B.active) syncProfile().catch(() => {}); }, 5 * 60000);
  window.addEventListener('online', () => { if (netCfg() && !netOn()) netConnect(true).catch(() => {}); });
  // 브라우저 뒤로가기 → 화면 닫기
  window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (modal.classList.contains('show')) closeSheet(); else if (menuEl.classList.contains('show')) menuEl.classList.remove('show'); else if (ovStack.length) closeOverlay(); } });
}
// 안드로이드 뒤로가기에서 호출 (MainActivity)
function androidBack() {
  if (modal.classList.contains('show')) { closeSheet(); return true; }
  if (B.active) { return true; }
  if (E.active) { if (E.phase !== 'result') endEncounter(); return true; }
  if (menuEl.classList.contains('show')) { menuEl.classList.remove('show'); return true; }
  if (ovStack.length) { closeOverlay(); return true; }
  return false;
}
boot();

</script>
</body>
