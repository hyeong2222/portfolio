# 유정국어 U-Care 안드로이드 셸 앱(TWA) 빌드
#
# 이 레포는 공개 상태이므로 서명키를 커밋하지 않는다.
#   1순위: 레포 시크릿 UCARE_KEYSTORE_BASE64
#   2순위: ucare-android/keystore/upload.jks (비공개 레포용)
#   없으면 매 빌드마다 임시 키 생성 (설치·테스트 전용)
name: Build UCare APK

on:
  push:
    branches: [ 'claude/apk-generation-**' ]
    paths-ignore: [ 'dist/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ucare-android

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 기본값인 'tools' 패키지는 안드로이드 SDK 저장소에서 사라져서
      # 그대로 쓰면 sdkmanager 가 exit 1 로 죽는다. 설치 목록을 직접 지정한다.
      # 플랫폼/빌드툴은 AGP 가 라이선스 동의 후 알아서 받아 간다.
      - name: Android SDK 준비
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 서명키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.UCARE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/upload.jks
            echo "SIGNING_MODE=real (secret)" >> "$GITHUB_ENV"
          elif [ -f keystore/upload.jks ]; then
            echo "SIGNING_MODE=real (repo file)" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "고정 서명키가 없어 임시 키를 생성합니다 (테스트 설치 전용)."
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/upload.jks -storetype PKCS12 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ucare2026 -keypass ucare2026 \
              -dname "CN=UCare Test Build, OU=CI, O=Yujeong, L=Daegu, C=KR"
          fi

      - name: 실행 권한
        run: chmod +x gradlew

      - name: APK 빌드
        env:
          UCARE_KEYSTORE_PASSWORD: ${{ secrets.UCARE_KEYSTORE_PASSWORD }}
          UCARE_KEY_PASSWORD: ${{ secrets.UCARE_KEY_PASSWORD }}
          UCARE_KEY_ALIAS: ${{ secrets.UCARE_KEY_ALIAS }}
        run: |
          [ -z "$UCARE_KEYSTORE_PASSWORD" ] && unset UCARE_KEYSTORE_PASSWORD
          [ -z "$UCARE_KEY_PASSWORD" ] && unset UCARE_KEY_PASSWORD
          [ -z "$UCARE_KEY_ALIAS" ] && unset UCARE_KEY_ALIAS
          ./gradlew --no-daemon assembleRelease

      - name: 결과물 정리 + 서명 확인
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ucare-release.apk
          ls -la out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "서명 모드: $SIGNING_MODE"
            echo "패키지: kr.co.kangyu.ucare"
            echo
            "$BT/apksigner" verify --print-certs --verbose out/ucare-release.apk
          } | tee out/ucare-signing-info.txt

      - name: APK 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: ucare-apk
          path: ucare-android/out/ucare-release.apk
          if-no-files-found: error

      - name: APK 를 브랜치에 커밋
        working-directory: .
        run: |
          mkdir -p dist
          cp ucare-android/out/ucare-release.apk dist/ucare-release.apk
          cp ucare-android/out/ucare-signing-info.txt dist/ucare-signing-info.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ucare-release.apk dist/ucare-signing-info.txt
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "ci: build ucare-release.apk (signing: $SIGNING_MODE)"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
